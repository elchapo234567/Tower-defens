    function loadProgress() {
      try {
        localStorage.removeItem("megaTowerDefenseProgress");
        const saved = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
        if (saved && Number.isFinite(saved.gems) && Array.isArray(saved.unlocked)) {
          gems = Math.max(0, Math.floor(saved.gems));
          bestWave = Math.max(0, Math.floor(saved.bestWave||0));
          completedMissions=Array.isArray(saved.completedMissions)?saved.completedMissions.filter(n=>Number.isInteger(n)&&n>=0&&n<MISSIONS.length):[];
          extraSlotUnlocked=saved.extraSlotUnlocked===true;
          fifthSlotUnlocked=saved.fifthSlotUnlocked===true&&extraSlotUnlocked;
          freeTowerAdProgress=Math.max(0,Math.min(5,Math.floor(saved.freeTowerAdProgress||0)));
          unlockedTowers = [...new Set(["gun", "laser", "ice", "rocket", "tesla", ...saved.unlocked])].filter(id => TOWER_TYPES.some(t => t.id === id));
        }
      } catch (_) { /* Das Spiel bleibt auch ohne verfügbaren Speicher spielbar. */ }
    }

    function saveProgress() {
      try { localStorage.setItem(SAVE_KEY, JSON.stringify({ gems, bestWave, completedMissions, extraSlotUnlocked, fifthSlotUnlocked, freeTowerAdProgress, unlocked: unlockedTowers })); } catch (_) {}

    async function initializeCrazySdk(){
      if(crazySdkInitStarted||!window.CrazyGames?.SDK)return;
      crazySdkInitStarted=true;
      try{
        await window.CrazyGames.SDK.init();
        crazySdkReady=true;
        window.CrazyGames.SDK.game?.loadingStop?.();
      }catch(_){crazySdkReady=false;crazySdkInitStarted=false;}

    function crazyGameEvent(name){

    function setAdMessage(kind,message,color="#8faab7"){
      if(kind==="gems"){rewardMessage=message;rewardMessageColor=color;}
      else freeTowerMessage=message;
    }

    function requestRewardedAd(kind){
      if(adInProgress||(kind==="gems"&&gameState!=="REWARDS")||(kind==="tower"&&gameState!=="FREE_TOWER"))return;
      if(kind==="tower"&&freeTowerAdProgress>=5)return;
      if(kind==="tower"&&!TOWER_TYPES.some(t=>t.unlock&&!unlockedTowers.includes(t.id))){freeTowerMessage="Alle Türme sind bereits freigeschaltet.";return;}
      if(!crazySdkReady){initializeCrazySdk();setAdMessage(kind,"Werbung ist nur in der CrazyGames-Version verfügbar.","#ffca68");return;}
      adInProgress=true;setAdMessage(kind,"Werbung wird geladen …","#8fe8ff");
      let settled=false;
      const finish=()=>{
        if(settled)return;settled=true;adInProgress=false;
        if(kind==="gems"){
          gems+=5;saveProgress();setAdMessage(kind,"Belohnung erhalten: +5 Gems!","#8fffb6");burst(W/2,H/2,"#c56dff",30,150);
        }else{
          freeTowerAdProgress=Math.min(5,freeTowerAdProgress+1);saveProgress();
          freeTowerMessage=freeTowerAdProgress>=5?"5/5 geschafft – wähle jetzt deinen Turm!":`Werbung abgeschlossen: ${freeTowerAdProgress}/5`;
        }
      };
      const fail=()=>{if(settled)return;settled=true;adInProgress=false;setAdMessage(kind,"Werbung nicht verfügbar – keine Belohnung verbraucht.","#ff8ca0");};
      try{
        const result=window.CrazyGames.SDK.ad.requestAd("rewarded",{
          adStarted:()=>setAdMessage(kind,"Werbung läuft …","#8fe8ff"),
          adFinished:finish,
          adError:fail
        });
        if(result&&typeof result.catch==="function")result.catch(fail);
      }catch(_){fail();}
    }

    function roundedRect(x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, radius);
    }

    function fillRounded(x, y, w, h, r, fill, stroke = null, line = 1) {
      roundedRect(x, y, w, h, r);
      ctx.fillStyle = fill;
      ctx.fill();
      if (stroke) {
        ctx.lineWidth = line;
        ctx.strokeStyle = stroke;
        ctx.stroke();
      }
    }

    function text(value, x, y, size, color = "#fff", align = "left", weight = 700) {
      ctx.font = `${weight} ${size}px Inter, system-ui, sans-serif`;
      ctx.fillStyle = color;
      ctx.textAlign = align;
      ctx.textBaseline = "middle";
      ctx.fillText(value, x, y);
    }

    function fittedText(value,x,y,maxWidth,maxSize,minSize,color="#fff",align="left",weight=800){
      let size=maxSize;do{ctx.font=`${weight} ${size}px Inter, system-ui, sans-serif`;if(ctx.measureText(value).width<=maxWidth)break;size--;}while(size>minSize);
      text(value,x,y,size,color,align,weight);
    }

    function insideRect(px, py, r) {
      return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
    }

    function button(rect, label, color, enabled = true, subtitle = "") {
      const hover = enabled && insideRect(mouse.x, mouse.y, rect);
      ctx.save();
      ctx.shadowColor = hover ? color : "rgba(0,0,0,.35)";
      ctx.shadowBlur = hover ? 28 : 12;
      const grad = ctx.createLinearGradient(rect.x, rect.y, rect.x, rect.y + rect.h);
      grad.addColorStop(0, enabled ? (hover ? lighten(color, 35) : lighten(color, 18)) : "#52606a");
      grad.addColorStop(1, enabled ? color : "#323b43");
      fillRounded(rect.x, rect.y + (hover ? -3 : 0), rect.w, rect.h, 15, grad, enabled ? "rgba(255,255,255,.55)" : "rgba(255,255,255,.12)", 2);
      text(label, rect.x + rect.w / 2, rect.y + rect.h / 2 - (subtitle ? 9 : 0) + (hover ? -3 : 0), subtitle ? 26 : 30, enabled ? "#fff" : "#9da7ad", "center", 900);
      if (subtitle) text(subtitle, rect.x + rect.w / 2, rect.y + rect.h / 2 + 18 + (hover ? -3 : 0), 14, enabled ? "rgba(255,255,255,.82)" : "#7f898e", "center", 700);
      ctx.restore();
      return hover;
    }

    function lighten(hex, amount) {
      const raw = hex.replace("#", "");
      const value = parseInt(raw.length === 3 ? raw.split("").map(c => c + c).join("") : raw, 16);
      const r = Math.min(255, (value >> 16) + amount);
      const g = Math.min(255, ((value >> 8) & 255) + amount);
      const b = Math.min(255, (value & 255) + amount);
      return `rgb(${r},${g},${b})`;
    }

    function drawBackdrop() {
      const grad = ctx.createRadialGradient(W * .5, H * .38, 40, W * .5, H * .5, 800);
      grad.addColorStop(0, "#173a55");
      grad.addColorStop(.52, "#091c2b");
      grad.addColorStop(1, "#030912");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = "rgba(82,180,225,.07)";
      ctx.lineWidth = 1;
      for (let x = -80; x < W + 100; x += 54) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 240, H); ctx.stroke();
      }
      for (let y = 18; y < H; y += 54) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }
    }

    function initMotes() {
      ambientMotes = Array.from({ length: 65 }, () => ({
        x: Math.random() * W, y: Math.random() * H,
        size: 1 + Math.random() * 3, speed: 6 + Math.random() * 18,
        phase: Math.random() * TAU
      }));
    }

    function drawMotes(dt) {
      for (const mote of ambientMotes) {
        mote.y -= mote.speed * dt;
        mote.x += Math.sin(elapsed * .7 + mote.phase) * 6 * dt;
        if (mote.y < -10) { mote.y = H + 10; mote.x = Math.random() * W; }
        ctx.globalAlpha = .18 + Math.sin(elapsed * 2 + mote.phase) * .1;
        ctx.fillStyle = "#79dfff";
        ctx.beginPath(); ctx.arc(mote.x, mote.y, mote.size, 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function drawLogo(y, scale = 1) {
      ctx.save();
      ctx.translate(W / 2, y);
      ctx.scale(scale, scale);
      ctx.shadowColor = "#43c7ff";
      ctx.shadowBlur = 30;
      text("MEGA", 0, -33, 66, "#eafaff", "center", 950);
      ctx.shadowColor = "#d48cff";
      text("TOWER DEFENSE", 0, 35, 57, "#74ddff", "center", 950);
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#ffca4f";
      ctx.fillRect(-230, 73, 460, 4);
      ctx.restore();
    }

    function drawMenu(dt) {
      drawBackdrop();
      drawMotes(dt);
      const pulse = 1 + Math.sin(elapsed * 1.6) * .015;
      drawLogo(185, pulse);

      ctx.save();
      ctx.translate(W / 2, 360);
      ctx.rotate(Math.sin(elapsed * .8) * .02);
      drawTowerModel(TOWER_TYPES[4], 0, 0, 2.05, elapsed * .5);
      ctx.restore();

    function wrapText(value, x, y, maxWidth, fontSize, lineHeight, color, maxLines=Infinity) {
      ctx.font = `600 ${fontSize}px Inter, system-ui, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = color;
      const words = value.split(" ");
      const lines = [];
      let line = "";
      for (const word of words) {
        const test = line ? line + " " + word : word;
        if (ctx.measureText(test).width > maxWidth && line) {
          if(lines.length===maxLines-1){line+=" …";break;}
          lines.push(line); line = word;
        }
        else line = test;
      }
      if(lines.length<maxLines)lines.push(line);
      lines.forEach((entry, i) => ctx.fillText(entry, x, y + i * lineHeight));
    }

    function pointAtDistance(distance) {
      const d = Math.max(0, Math.min(totalPathLength, distance));
      for (const seg of pathSegments) {
        if (d <= seg.start + seg.length) {
          const t = (d - seg.start) / seg.length;
          return { x: seg.a.x + seg.dx * t, y: seg.a.y + seg.dy * t };
        }
      }
      return { ...path[path.length - 1] };
    }

        ctx.fillStyle="#172218";fillRounded(-24,-15,48,30,7,"#18251b");ctx.fillStyle=vehicle.level===1?"#668a49":"#789956";fillRounded(-20,-12,40,24,6,ctx.fillStyle,"#b9db8f",2);
        ctx.fillStyle="#142019";ctx.fillRect(-18,-18,11,5);ctx.fillRect(8,-18,11,5);ctx.fillRect(-18,13,11,5);ctx.fillRect(8,13,11,5);ctx.fillStyle="#bfe4dc";ctx.fillRect(7,-8,10,16);
        if(vehicle.level>=2){ctx.fillStyle="#3c5435";ctx.beginPath();ctx.arc(-3,0,9,0,TAU);ctx.fill();}
        if(vehicle.level>=3){ctx.fillStyle="#263927";ctx.beginPath();ctx.arc(0,0,11,0,TAU);ctx.fill();ctx.fillStyle="#d9f3b4";ctx.fillRect(6,-3,28,6);}
      }else{
        ctx.fillStyle="#18231a";fillRounded(-31,-20,62,40,9,"#18231a");ctx.fillStyle="#789956";for(const sy of [-16,12])fillRounded(-29,sy,58,8,4,"#789956");
        ctx.fillStyle="#405b39";fillRounded(-23,-14,45,28,7,"#405b39","#b8db8d",2);ctx.beginPath();ctx.arc(2,0,14,0,TAU);ctx.fill();ctx.fillStyle="#e5f6c8";ctx.fillRect(10,-4,38,8);ctx.fillStyle="#cc9b51";ctx.fillRect(-8,11,13,7);
      }
      ctx.restore();
      const w=vehicle.level===4?60:46,ratio=Math.max(0,vehicle.hp/vehicle.maxHp);fillRounded(vehicle.x-w/2,vehicle.y-31,w,7,4,"rgba(5,10,7,.85)");if(ratio>0)fillRounded(vehicle.x-w/2+2,vehicle.y-29,(w-4)*ratio,3,2,ratio>.45?"#9ad760":"#ff875c");
    }

    function getTowerType(id) { return TOWER_TYPES.find(t => t.id === id); }
    function currentTowerCost(type){return Math.round(type.cost*Math.pow(1.18,placedCounts[type.id]||0));}
    function towerAbility(tower){
      if(tower.type.levels)return tower.type.levels[tower.level-1];
      if(tower.type.id==="ice")return tower.level>=3?"Permafrost":"Frostverlangsamung";
      if(tower.type.id==="rocket")return tower.level>=4?"Doppelsprengkopf":"Flächenrakete";
      if(tower.type.id==="chrono")return tower.level>=3?"Zeitstillstand":"Zeitfeld";
      if(tower.type.id==="mortar")return tower.level>=3?"Schwere Granate":"Flächenbeschuss";
      return tower.level>=4?"Überladung":"Verbesserte Feuerkraft";
    }

    function applyLevelStats(tower){
      const l=tower.level,type=tower.type;
      if(type.id==="helicopter"){
        const stats=[{d:105,r:225,f:.42,w:"sniper"},{d:24,r:220,f:3.2,w:"ar"},{d:72,r:230,f:1.35,w:"cannon"},{d:22,r:240,f:8.5,w:"minigun"}][l-1];
        tower.damage=stats.d;tower.range=stats.r;tower.rate=stats.f;tower.weapon=stats.w;
      }else if(type.id==="airplane"){
        const stats=[{d:42,r:250,f:1.4,w:"cannon"},{d:88,r:260,f:.7,w:"firebomb"},{d:70,r:270,f:1,w:"cluster"},{d:125,r:285,f:.85,w:"missile"}][l-1];
        tower.damage=stats.d;tower.range=stats.r;tower.rate=stats.f;tower.weapon=stats.w;
      }else if(type.id==="military"){
        const stats=[{r:0,h:180,s:82},{r:0,h:310,s:72},{r:120,h:390,s:67},{r:155,h:680,s:54}][l-1];
        tower.damage=0;tower.range=stats.r;tower.rate=0;tower.vehicleHp=stats.h;tower.vehicleSpeed=stats.s;
        if(!Number.isFinite(tower.deployTimer))tower.deployTimer=3;
      }else{
        tower.damage=type.damage*Math.pow(1.34,l-1);tower.range=type.range*(1+.075*(l-1));tower.rate=type.rate*Math.pow(1.13,l-1);
      }
    }

    function deployVehicle(base,waveStart=false){
      if(!base||base.type.id!=="military")return;
      const p=pointAtDistance(totalPathLength-25),level=base.level;
      vehicles.push({base,level,x:p.x,y:p.y,distance:totalPathLength-25,hp:base.vehicleHp,maxHp:base.vehicleHp,speed:base.vehicleSpeed,range:level>=3?base.range:0,cooldown:.2,bombCooldown:1,dead:false,angle:Math.PI});
      base.deployTimer=60;
      burst(p.x,p.y,base.type.color,waveStart?20:12,90);
    }

    function updateVehicles(dt){
      for(const vehicle of vehicles){
        if(vehicle.dead)continue;
        vehicle.distance-=vehicle.speed*dt;const p=pointAtDistance(vehicle.distance);vehicle.x=p.x;vehicle.y=p.y;
        const ahead=pointAtDistance(Math.max(0,vehicle.distance-5));vehicle.angle=Math.atan2(ahead.y-vehicle.y,ahead.x-vehicle.x);
        vehicle.cooldown-=dt;vehicle.bombCooldown-=dt;
        if(vehicle.level>=3&&vehicle.cooldown<=0){
          const target=enemies.filter(e=>!e.dead&&Math.hypot(e.x-vehicle.x,e.y-vehicle.y)<=vehicle.range).sort((a,b)=>b.distance-a.distance)[0];
          if(target){const damage=vehicle.level===4?34:19;damageEnemy(target,damage,"vehicle");effects.push({type:"gun",x:vehicle.x,y:vehicle.y,tx:target.x,ty:target.y,life:.1,maxLife:.1,color:"#dfff9e"});vehicle.cooldown=vehicle.level===4?.25:.42;}
        }
        if(vehicle.level===4&&vehicle.bombCooldown<=0){
          const target=enemies.filter(e=>!e.dead&&Math.hypot(e.x-vehicle.x,e.y-vehicle.y)<=vehicle.range+35).sort((a,b)=>b.distance-a.distance)[0];
          if(target){effects.push({type:"mortar",x:vehicle.x,y:vehicle.y,tx:target.x,ty:target.y,target,life:.48,maxLife:.48,color:"#9fca6b",damage:105,splash:75});vehicle.bombCooldown=2.8;}
        }
        const contacts=enemies.filter(e=>!e.dead&&Math.hypot(e.x-vehicle.x,e.y-vehicle.y)<e.data.radius+(vehicle.level===4?25:18)).sort((a,b)=>b.distance-a.distance);
        if(contacts.length){const enemy=contacts[0],before=enemy.hp,armor=enemy.data.armor||0;damageEnemy(enemy,vehicle.hp/Math.max(.05,1-armor),"ram");vehicle.hp-=Math.min(before,vehicle.hp);shake=Math.max(shake,4);burst(vehicle.x,vehicle.y,"#ffbc58",14,120);if(vehicle.hp<=0){vehicle.dead=true;effects.push({type:"explosion",x:vehicle.x,y:vehicle.y,life:.38,maxLife:.38,color:"#ff9b45"});}}
        if(vehicle.distance<=0)vehicle.dead=true;
      }
      if(selectedVehicle&&selectedVehicle.dead)selectedVehicle=null;
    }

    function drawPlacedTower(tower) {
      const target = tower.target && !tower.target.dead ? tower.target : null;
      const tx=tower.combatX??tower.x,ty=tower.combatY??tower.y;
      const angle = target ? Math.atan2(target.y - ty, target.x - tx) : tower.angle;
      tower.angle = angle;
      if(selectedPlacedTower===tower){ctx.save();ctx.globalAlpha=.18;ctx.fillStyle=tower.type.color;ctx.beginPath();ctx.arc(tower.x,tower.y,tower.range,0,TAU);ctx.fill();ctx.globalAlpha=.8;ctx.strokeStyle=tower.type.color;ctx.lineWidth=2;ctx.stroke();ctx.restore();}
      if(tower.type.id==="helicopter"||tower.type.id==="airplane")drawAirPad(tower);
      drawTowerModel(tower.type, tx, ty, .9, angle,tower.level);
      for(let i=0;i<tower.level;i++){ctx.fillStyle=i===0?"#fff":tower.type.color;ctx.beginPath();ctx.arc(tower.x-12+(i-1)*8,tower.y+31,3,0,TAU);ctx.fill();}
    }

    function drawPlacementPreview() {
      if (!selectedTowerType || mouse.y >= FIELD_H || !mouse.inside) return;
      const type = getTowerType(selectedTowerType);
      const valid = isValidPlacement(mouse.x, mouse.y) && gold >= currentTowerCost(type) && (placedCounts[type.id]||0)<placementLimit();
      ctx.save();
      ctx.globalAlpha = .18;
      ctx.fillStyle = valid ? type.color : "#ff4355";
      ctx.beginPath(); ctx.arc(mouse.x, mouse.y, type.range, 0, TAU); ctx.fill();
      ctx.globalAlpha = .7;
      ctx.strokeStyle = valid ? type.color : "#ff4355";
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(mouse.x, mouse.y, type.range, 0, TAU); ctx.stroke();
      ctx.globalAlpha = .72;
      drawTowerModel(type, mouse.x, mouse.y, .9, -Math.PI / 2);
      ctx.restore();
    }

    function distToSegment(px, py, a, b) {
      const dx = b.x - a.x, dy = b.y - a.y;
      const l2 = dx * dx + dy * dy;
      const t = Math.max(0, Math.min(1, ((px - a.x) * dx + (py - a.y) * dy) / l2));
      return Math.hypot(px - (a.x + t * dx), py - (a.y + t * dy));
    }

    function isValidPlacement(x, y) {
      if (x < 35 || x > W - 35 || y < 105 || y > FIELD_H - 35) return false;
      if (pathSegments.some(seg => distToSegment(x, y, seg.a, seg.b) < pathWidths / 2 + 30)) return false;
      if (towers.some(t => Math.hypot(x - t.x, y - t.y) < 68)) return false;
      return true;
    }

    function resetGame() {
      towers = [];
      vehicles = [];
      enemies = [];
      effects = [];
      particles = [];
      placedCounts = {};
      hp = 20;
      gold = MISSIONS[selectedMission].startGold;
      wave = 0;
      waveActive = false;
      waveQueue = [];
      spawnTimer = 0;
      spawnedThisWave = 0;
      nextWaveCountdown = 1.2;
      gameSpeed = 1;
      selectedTowerType = null;
      selectedPlacedTower = null;
      selectedVehicle = null;
      toast = { text: "Bereit zur Verteidigung!", time: 2.2, color: "#8fe8ff" };
    }

    function beginWave() {
      wave++;
      waveActive = true;
      waveQueue = [];
      const mission=MISSIONS[selectedMission];
      const normalCount = Math.ceil((6 + wave * 2+Math.max(0,Math.floor((mission.difficulty-1)*4)))*mission.density);
      const fastCount = Math.ceil((1 + Math.max(0, wave - 1) * 2)*mission.density);
      for (let i = 0; i < normalCount; i++) waveQueue.push("normal");
      for (let i = 0; i < fastCount; i++) waveQueue.splice(Math.min(waveQueue.length, 2 + i * 3), 0, "fast");
      if(wave>=2) for(let i=0;i<Math.ceil(wave/2*mission.density);i++) waveQueue.splice(Math.min(waveQueue.length,4+i*5),0,"armored");
      if(wave>=3) for(let i=0;i<Math.ceil(wave*mission.density);i++) waveQueue.splice(Math.min(waveQueue.length,3+i*4),0,"phantom");
      if(wave>=4) for(let i=0;i<Math.ceil(wave/3*mission.density);i++) waveQueue.push("brute");
      if(wave>=2) for(let i=0;i<Math.ceil((wave+1)*mission.density);i++) waveQueue.splice(Math.min(waveQueue.length,1+i*3),0,"swarm");
      const maxWaveUnits=Math.min(260,Math.floor(90+selectedMission*7+wave*1.5));
      if(waveQueue.length>maxWaveUnits){const original=[...waveQueue];waveQueue=Array.from({length:maxWaveUnits},(_,i)=>original[Math.floor(i*original.length/maxWaveUnits)]);}
      const bossWave=wave%5===0||wave===mission.waves;
      const bossCount=bossWave?Math.min(5,mission.bosses+Math.floor(Math.max(0,wave-15)/15)):0;
      for(let i=0;i<bossCount;i++)waveQueue.push("boss");
      for(const tower of towers)if(tower.type.id==="military")deployVehicle(tower,true);
      spawnTimer = .2;
      spawnedThisWave = 0;
      toast = { text: bossCount ? `WELLE ${wave} — ${bossCount}× BOSS-ALARM!` : `WELLE ${wave}`, time: 2.4, color: bossCount ? "#ff6670" : "#8fe8ff" };
    }

    function spawnEnemy(kind) {
      const base = ENEMY_TYPES[kind];
      const mission=MISSIONS[selectedMission];
      const hpScale = Math.pow(1.17, wave - 1)*mission.difficulty;
      const bossScale = kind === "boss" ? 1 + Math.floor(wave / 5 - 1) * .3 : 1;
      const eliteInterval=Math.max(3,7-Math.floor(selectedMission/4));
      const elite=wave>=4&&spawnedThisWave>0&&spawnedThisWave%eliteInterval===0;
      spawnedThisWave++;
      const maxHp = Math.round(base.hp * hpScale * bossScale*(elite?1.7:1));
      const p = pointAtDistance(0);
      enemies.push({
        kind, data: base, x: p.x, y: p.y, distance: 0,
        hp: maxHp, maxHp, reward:Math.round(base.reward*(elite?2:1)*(1+wave*.018)),elite,speed: base.speed * (1 + Math.min(.32, wave * .012))*Math.pow(mission.difficulty,.18)*(elite?1.06:1),
        slow: 0, slowFactor: 1, poison: 0, poisonDps: 0, burn:0, burnDps:0, dead: false, phase: Math.random() * TAU
      });
    }

    function updatePlaying(dt) {
      if (nextWaveCountdown > 0) {
        nextWaveCountdown -= dt;
        if (nextWaveCountdown <= 0) beginWave();
      }

      if (waveActive && waveQueue.length) {
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawnEnemy(waveQueue.shift());
          spawnTimer = Math.max(.2, (.92 - wave * .018)/MISSIONS[selectedMission].density);
        }
      }

      for (const enemy of enemies) {
        if (enemy.dead) continue;
        if (enemy.slow > 0) enemy.slow -= dt;
        else enemy.slowFactor = 1;
        if(enemy.poison>0){enemy.poison-=dt;damageEnemy(enemy,enemy.poisonDps*dt,"poison",true);}
        if(enemy.burn>0){enemy.burn-=dt;damageEnemy(enemy,enemy.burnDps*dt,"fire",true);}
        enemy.distance += enemy.speed * enemy.slowFactor * dt;
        const p = pointAtDistance(enemy.distance);
        enemy.x = p.x; enemy.y = p.y;
        if (enemy.distance >= totalPathLength) {
          enemy.dead = true;
          hp--;
          shake = 10;
          burst(enemy.x, enemy.y, "#ff5364", 18, 140);
          toast = { text: "Der Kern wurde getroffen!", time: 1.4, color: "#ff7180" };
          if (hp <= 0) {
            hp = 0;
            crazyGameEvent("gameplayStop");
            gameState = "GAMEOVER";
            selectedTowerType = null;
          }
        }
      }

      for (const tower of towers) updateTower(tower, dt);
      updateVehicles(dt);
      enemies = enemies.filter(e => !e.dead);
      vehicles = vehicles.filter(v=>!v.dead);

      if (waveActive && waveQueue.length === 0 && enemies.length === 0) {
        waveActive = false;
        nextWaveCountdown = 5;
        const bonus = 38 + wave * 7;
        const gemReward = wave%3===0?1:0;
        gold += bonus;
        gems += gemReward;
        bestWave=Math.max(bestWave,wave);
        if(wave>=MISSIONS[selectedMission].waves){
          gems+=5;
          if(!completedMissions.includes(selectedMission))completedMissions.push(selectedMission);
          saveProgress();crazyGameEvent("gameplayStop");gameState="VICTORY";selectedTowerType=null;selectedPlacedTower=null;selectedVehicle=null;
          toast={text:"",time:0,color:"#fff"};updateEffects(dt);return;
        }
        saveProgress();
        toast = { text: `Welle geschafft! +${bonus} Gold${gemReward?"  +1 Gem":""}`, time: 3, color: gemReward?"#e7b8ff":"#ffd45b" };
      }

      updateEffects(dt);
      if (toast.time > 0) toast.time -= dt;
      shake = Math.max(0, shake - 30 * dt);
    }

    function updateTower(tower, dt) {
      if(tower.type.id==="military"){
        tower.deployTimer-=dt;if(tower.deployTimer<=0)deployVehicle(tower,false);return;
      }
      if(tower.type.id==="helicopter"||tower.type.id==="airplane"){
        tower.orbit+=dt*(tower.type.id==="helicopter"?.72:1.05);
        const radius=tower.type.id==="helicopter"?52:78;
        tower.combatX=tower.x+Math.cos(tower.orbit)*radius;
        tower.combatY=tower.y+Math.sin(tower.orbit)*(tower.type.id==="helicopter"?30:44);
      }else{tower.combatX=tower.x;tower.combatY=tower.y;}
      tower.cooldown -= dt;
      if (tower.target && (tower.target.dead || Math.hypot(tower.target.x - tower.combatX, tower.target.y - tower.combatY) > tower.range)) tower.target = null;
      if (!tower.target) {
        let best = null;
        for (const enemy of enemies) {
          if (!enemy.dead && Math.hypot(enemy.x - tower.combatX, enemy.y - tower.combatY) <= tower.range && (!best || enemy.distance > best.distance)) best = enemy;
        }
        tower.target = best;
      }
      if (tower.target) tower.angle = Math.atan2(tower.target.y - tower.y, tower.target.x - tower.x);
      if (tower.target && tower.cooldown <= 0) {
        fireTower(tower, tower.target);
        tower.cooldown = 1 / tower.rate;
      }
    }

    function fireTower(tower, target) {
      const type = tower.type;
      const ox=tower.combatX??tower.x,oy=tower.combatY??tower.y;
      if (type.id === "rocket") {
        effects.push({ type: "rocket", x: ox, y: oy, tx: target.x, ty: target.y, target, life: .42, maxLife: .42, color: type.color, damage: tower.damage, splash:type.splash+(tower.level-1)*5 });
        if(tower.level>=4)effects.push({type:"rocket",x:ox,y:oy,tx:target.x+12,ty:target.y-8,target,life:.5,maxLife:.5,color:type.color,damage:tower.damage*.58,splash:type.splash});
      } else if(type.id==="mortar"){
        effects.push({type:"mortar",x:ox,y:oy,tx:target.x,ty:target.y,target,life:.62,maxLife:.62,color:type.color,damage:tower.damage,splash:type.splash+(tower.level-1)*10});
      } else if(type.id==="chrono"){
        for(const enemy of enemies)if(!enemy.dead&&Math.hypot(enemy.x-target.x,enemy.y-target.y)<82+tower.level*7){enemy.slow=Math.max(enemy.slow,1.8+tower.level*.35);enemy.slowFactor=Math.min(enemy.slowFactor,.52-tower.level*.06);damageEnemy(enemy,tower.damage,"chrono");}
        effects.push({type:"chrono",x:target.x,y:target.y,life:.55,maxLife:.55,color:type.color});
      } else if(type.id==="helicopter"){
        const effect=tower.weapon==="sniper"?"sniper":"gun";
        if(tower.weapon==="cannon"){
          for(const enemy of enemies)if(!enemy.dead&&Math.hypot(enemy.x-target.x,enemy.y-target.y)<48)damageEnemy(enemy,tower.damage,"helicopter");
          effects.push({type:"cannon",x:ox,y:oy,tx:target.x,ty:target.y,life:.18,maxLife:.18,color:type.color});
          effects.push({type:"explosion",x:target.x,y:target.y,life:.28,maxLife:.28,color:type.color});
        }else{damageEnemy(target,tower.damage,"helicopter");effects.push({type:effect,x:ox,y:oy,tx:target.x,ty:target.y,life:.1,maxLife:.1,color:type.color});}
      } else if(type.id==="airplane"){
        if(tower.weapon==="cannon"){damageEnemy(target,tower.damage,"airplane");effects.push({type:"gun",x:ox,y:oy,tx:target.x,ty:target.y,life:.1,maxLife:.1,color:type.color});}
        else effects.push({type:tower.weapon==="missile"?"rocket":"airbomb",x:ox,y:oy,tx:target.x,ty:target.y,target,life:.5,maxLife:.5,color:type.color,damage:tower.damage,splash:tower.weapon==="cluster"?105:72,burn:tower.weapon==="firebomb"});
      } else if(type.id==="sun"){
        for(const enemy of enemies){const distance=Math.hypot(enemy.x-ox,enemy.y-oy);if(!enemy.dead&&distance<=tower.range)damageEnemy(enemy,tower.damage*(.42+.58*(1-distance/tower.range)),"sun");}
        effects.push({type:"nova",x:ox,y:oy,life:.45,maxLife:.45,color:type.color});
      } else {
        damageEnemy(target, tower.damage, type.id);
        effects.push({ type: type.id, x: ox, y: oy, tx: target.x, ty: target.y, life: type.id === "tesla" ? .2 : .13, maxLife: type.id === "tesla" ? .2 : .13, color: type.color });
        if (type.id === "ice" && !target.dead) {
          target.slow = 2.3;
          target.slowFactor = .55;
        }
        if(type.id==="poison"&&!target.dead){target.poison=Math.max(target.poison,3.5);target.poisonDps=Math.max(target.poisonDps,tower.damage*1.2);}
        if (type.id === "tesla") {
          let from = target;
          const hit = new Set([target]);
          for (let jump = 0; jump < 2; jump++) {
            const next = enemies.filter(e => !e.dead && !hit.has(e) && Math.hypot(e.x - from.x, e.y - from.y) < 105).sort((a,b) => b.distance - a.distance)[0];
            if (!next) break;
            damageEnemy(next, Math.round(tower.damage * (.64 - jump * .14)), "tesla");
            effects.push({ type: "tesla", x: from.x, y: from.y, tx: next.x, ty: next.y, life: .2, maxLife: .2, color: type.color });
            hit.add(next); from = next;
          }
        }
      }
    }

    function damageEnemy(enemy, amount, source, quiet=false) {
      if (!enemy || enemy.dead) return;
      const armor=enemy.data.armor||0;
      enemy.hp -= amount*(1-armor);
      if(!quiet)burst(enemy.x, enemy.y, source === "ice" ? "#9ff3ff" : source === "tesla" ? "#bd9cff" : source === "poison"?"#7fed63":"#ffd36a", source === "rocket" ? 15 : 4, source === "rocket" ? 100 : 55);
      if (enemy.hp <= 0) {
        enemy.dead = true;
        gold += enemy.reward;
        burst(enemy.x, enemy.y, enemy.data.color, enemy.kind === "boss" ? 42 : 18, enemy.kind === "boss" ? 180 : 110);
        effects.push({ type: "reward", x: enemy.x, y: enemy.y - enemy.data.radius, value: enemy.reward, life: 1, maxLife: 1 });
        if (enemy.kind === "boss") shake = 14;
      }
    }

    function updateEffects(dt) {
      for (const effect of effects) {
        effect.life -= dt;
        if (["rocket","mortar","airbomb"].includes(effect.type) && effect.life <= 0 && !effect.exploded) {
          effect.exploded = true;
          const impact = effect.target && !effect.target.dead ? effect.target : { x: effect.tx, y: effect.ty };
          effect.tx = impact.x; effect.ty = impact.y;
          for (const enemy of enemies) {
            const d = Math.hypot(enemy.x - impact.x, enemy.y - impact.y);
            if (!enemy.dead && d <= effect.splash) {
              damageEnemy(enemy, Math.round(effect.damage * Math.max(.35,1-d/(effect.splash*1.7))), effect.type);
              if(effect.burn&&!enemy.dead){enemy.burn=Math.max(enemy.burn,3);enemy.burnDps=Math.max(enemy.burnDps,effect.damage*.22);}
            }
          }
          burst(impact.x, impact.y, "#ff7a3d", 30, 170);
          effects.push({ type: "explosion", x: impact.x, y: impact.y, life: .42, maxLife: .42, color: effect.color||"#ff7a3d" });
          shake = Math.max(shake, 5);
        }
      }
      effects = effects.filter(e => e.life > 0 || (["rocket","mortar","airbomb"].includes(e.type) && !e.exploded));
      for (const p of particles) {
        p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .97; p.vy *= .97;
      }
      particles = particles.filter(p => p.life > 0);
    }

    function burst(x, y, color, count, speed) {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * TAU;
        const s = speed * (.3 + Math.random() * .7);
        particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .25 + Math.random() * .5, maxLife: .75, size: 2 + Math.random() * 4, color });
      }
    }

    function drawEnemy(enemy) {
      const r = enemy.data.radius;
      ctx.save();
      ctx.translate(enemy.x, enemy.y + Math.sin(elapsed * 5 + enemy.phase) * 2);
      if(enemy.elite){ctx.globalAlpha=.23+Math.sin(elapsed*6+enemy.phase)*.08;ctx.fillStyle="#ffd35a";ctx.beginPath();ctx.arc(0,0,r+13,0,TAU);ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle="#ffe784";ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,r+8,0,TAU);ctx.stroke();}
      if (enemy.slowFactor < 1) {
        ctx.strokeStyle = "rgba(117,230,255,.6)"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, 0, r + 6, -elapsed * 2, Math.PI - elapsed * 2); ctx.stroke();
      }
      if(enemy.poison>0){ctx.strokeStyle="rgba(112,244,83,.7)";ctx.lineWidth=2;ctx.setLineDash([4,6]);ctx.beginPath();ctx.arc(0,0,r+9,elapsed,elapsed+Math.PI*1.6);ctx.stroke();ctx.setLineDash([]);}
      if(enemy.burn>0){ctx.fillStyle="rgba(255,126,49,.55)";for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(-8+i*8,-r-4-Math.sin(elapsed*8+i)*4,3+i,0,TAU);ctx.fill();}}
      if (enemy.kind === "normal") drawNormalMonster(r);
      else if (enemy.kind === "fast") drawFastMonster(r);
      else if(enemy.kind==="armored")drawArmoredMonster(r);
      else if(enemy.kind==="phantom")drawPhantomMonster(r);
      else if(enemy.kind==="brute")drawBruteMonster(r);
      else if(enemy.kind==="swarm")drawSwarmMonster(r);
      else drawBossMonster(r);
      ctx.restore();
      drawEnemyHealth(enemy);
    }

    function drawNormalMonster(r) {
      ctx.shadowColor = "#55d65d"; ctx.shadowBlur = 10;
      ctx.fillStyle = "#34523b"; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
      ctx.fillStyle = "#6bd563"; ctx.beginPath(); ctx.arc(0, 2, r - 6, 0, TAU); ctx.fill();
      ctx.fillStyle = "#263a32"; ctx.fillRect(-r, -8, r * 2, 8); ctx.fillRect(-5, -r, 10, r * 2);
      ctx.strokeStyle = "#a6f28a"; ctx.lineWidth = 2; ctx.strokeRect(-r + 3, -7, r * 2 - 6, 6);
      ctx.fillStyle = "#ffed8d"; ctx.beginPath(); ctx.arc(-7, 4, 3, 0, TAU); ctx.arc(7, 4, 3, 0, TAU); ctx.fill();
      ctx.fillStyle = "#173123"; ctx.fillRect(-8, 12, 16, 3);
    }

    function drawFastMonster(r) {
      ctx.shadowColor = "#ffe04c"; ctx.shadowBlur = 15;
      ctx.fillStyle = "#cf9823"; ctx.beginPath(); ctx.moveTo(r + 8,0); ctx.lineTo(-r, -r + 3); ctx.lineTo(-r + 5, r); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#ffdf45"; ctx.beginPath(); ctx.moveTo(r,0); ctx.lineTo(-r + 5, -r + 7); ctx.lineTo(-r + 9, r - 6); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "#fff6a0"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-4,-r-9); ctx.lineTo(4,-r+1); ctx.lineTo(-1,4); ctx.lineTo(10,13); ctx.stroke();
      ctx.fillStyle = "#342b12"; ctx.beginPath(); ctx.arc(5, -4, 3, 0, TAU); ctx.fill();
    }

    function drawArmoredMonster(r){
      ctx.shadowColor="#729bd0";ctx.shadowBlur=12;ctx.fillStyle="#26384a";ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.fill();
      ctx.fillStyle="#7190ae";for(let i=0;i<6;i++){ctx.rotate(TAU/6);ctx.beginPath();ctx.moveTo(4,-10);ctx.lineTo(r+4,-7);ctx.lineTo(r+9,0);ctx.lineTo(r+4,7);ctx.lineTo(4,10);ctx.closePath();ctx.fill();}
      ctx.fillStyle="#172431";ctx.beginPath();ctx.arc(0,0,13,0,TAU);ctx.fill();ctx.strokeStyle="#b7d5ef";ctx.lineWidth=3;ctx.stroke();ctx.fillStyle="#ff9d4d";ctx.fillRect(-8,-3,16,6);
    }

    function drawPhantomMonster(r){
      ctx.globalAlpha=.35;ctx.fillStyle="#68fff0";ctx.beginPath();ctx.arc(0,0,r+8,0,TAU);ctx.fill();ctx.globalAlpha=.85;
      ctx.fillStyle="#37bdb9";ctx.beginPath();ctx.moveTo(0,-r);ctx.bezierCurveTo(r,-r,r,r*.45,r*.55,r*.55);ctx.lineTo(r*.2,r);ctx.lineTo(0,r*.58);ctx.lineTo(-r*.25,r);ctx.lineTo(-r*.6,r*.5);ctx.bezierCurveTo(-r,-r*.1,-r,-r,0,-r);ctx.fill();
      ctx.fillStyle="#eaffff";ctx.beginPath();ctx.arc(-7,-3,4,0,TAU);ctx.arc(7,-3,4,0,TAU);ctx.fill();
    }

    function drawBruteMonster(r){
      ctx.shadowColor="#d17d42";ctx.shadowBlur=10;ctx.fillStyle="#5a3326";ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.fill();ctx.fillStyle="#b86e40";
      for(let i=0;i<7;i++){const a=i*TAU/7;ctx.beginPath();ctx.arc(Math.cos(a)*r*.6,Math.sin(a)*r*.6,9,0,TAU);ctx.fill();}
      ctx.fillStyle="#291915";ctx.beginPath();ctx.arc(0,2,17,0,TAU);ctx.fill();ctx.fillStyle="#ffdc63";ctx.beginPath();ctx.arc(-7,-3,3,0,TAU);ctx.arc(7,-3,3,0,TAU);ctx.fill();
    }

    function drawSwarmMonster(r){
      ctx.shadowColor="#ff75d4";ctx.shadowBlur=15;ctx.fillStyle="#d44da9";ctx.beginPath();
      for(let i=0;i<8;i++){const a=i*TAU/8,rr=i%2?r*.55:r;const x=Math.cos(a)*rr,y=Math.sin(a)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.closePath();ctx.fill();
      ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(4,-2,4,0,TAU);ctx.fill();ctx.fillStyle="#451039";ctx.beginPath();ctx.arc(5,-2,2,0,TAU);ctx.fill();
    }

    function drawBossMonster(r) {
      ctx.globalAlpha = .18 + Math.sin(elapsed * 5) * .08;
      ctx.fillStyle = "#ff2e3e"; ctx.beginPath(); ctx.arc(0, 0, r + 13, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
      ctx.shadowColor = "#ff263d"; ctx.shadowBlur = 22;
      ctx.fillStyle = "#631e29"; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
      ctx.strokeStyle = "#ff6363"; ctx.lineWidth = 5; ctx.stroke();
      ctx.fillStyle = "#aa2934"; ctx.beginPath(); ctx.arc(0, 3, r - 9, 0, TAU); ctx.fill();
      ctx.fillStyle = "#43141c";
      for (let i = 0; i < 8; i++) { ctx.rotate(TAU / 8); ctx.beginPath(); ctx.moveTo(r - 5, -7); ctx.lineTo(r + 15, 0); ctx.lineTo(r - 5, 7); ctx.closePath(); ctx.fill(); }
      ctx.fillStyle = "#fff0a5"; ctx.beginPath(); ctx.moveTo(-18,-8); ctx.lineTo(-4,-3); ctx.lineTo(-17,3); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.moveTo(18,-8); ctx.lineTo(4,-3); ctx.lineTo(17,3); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#210b10"; ctx.fillRect(-16, 12, 32, 7);
      ctx.fillStyle = "#fff"; for (let x = -12; x <= 8; x += 10) { ctx.beginPath(); ctx.moveTo(x,12); ctx.lineTo(x+5,20); ctx.lineTo(x+9,12); ctx.fill(); }
    }

    function drawEnemyHealth(enemy) {
      const w = enemy.kind === "boss" ? 82 : 48;
      const y = enemy.y - enemy.data.radius - 16;
      fillRounded(enemy.x - w / 2, y, w, 8, 4, "rgba(8,14,18,.85)");
      const ratio = Math.max(0, enemy.hp / enemy.maxHp);
      if (ratio > 0) fillRounded(enemy.x - w / 2 + 2, y + 2, (w - 4) * ratio, 4, 2, ratio > .5 ? "#5fe066" : ratio > .22 ? "#ffd34d" : "#ff4d5d");
    }

    function drawEffects() {
      for (const e of effects) {
        const alpha = Math.max(0, e.life / e.maxLife);
        ctx.save(); ctx.globalAlpha = alpha;
        if (e.type === "gun") {
          ctx.strokeStyle = "#fff2a4"; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.tx, e.ty); ctx.stroke();
        } else if (e.type === "laser") {
          ctx.shadowColor = e.color; ctx.shadowBlur = 18; ctx.strokeStyle = e.color; ctx.lineWidth = 7;
          ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.tx, e.ty); ctx.stroke();
          ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
        } else if(e.type==="plasma"){
          ctx.shadowColor=e.color;ctx.shadowBlur=24;ctx.strokeStyle=e.color;ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.tx,e.ty);ctx.stroke();ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.stroke();
        } else if(e.type==="sniper"){
          ctx.strokeStyle=e.color;ctx.lineWidth=3;ctx.setLineDash([16,5]);ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.tx,e.ty);ctx.stroke();ctx.setLineDash([]);
        } else if(e.type==="cannon"){
          ctx.shadowColor="#eaffc9";ctx.shadowBlur=20;ctx.strokeStyle="#eaffc9";ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.tx,e.ty);ctx.stroke();ctx.strokeStyle=e.color;ctx.lineWidth=3;ctx.stroke();
        } else if(e.type==="poison"){
          ctx.strokeStyle=e.color;ctx.lineWidth=5;ctx.setLineDash([3,9]);ctx.lineDashOffset=-elapsed*60;ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.tx,e.ty);ctx.stroke();ctx.setLineDash([]);
        } else if (e.type === "ice") {
          ctx.strokeStyle = e.color; ctx.lineWidth = 5; ctx.setLineDash([8, 8]);
          ctx.lineDashOffset = -elapsed * 80; ctx.beginPath(); ctx.moveTo(e.x,e.y); ctx.lineTo(e.tx,e.ty); ctx.stroke();
        } else if (e.type === "tesla") {
          drawLightning(e.x, e.y, e.tx, e.ty, e.color);
        } else if (["rocket","mortar","airbomb"].includes(e.type)) {
          const t = 1 - Math.max(0, e.life / e.maxLife);
          const x = e.x + (e.tx - e.x) * t;
          const arc=e.type==="mortar"?95:e.type==="airbomb"?55:35;
          const y = e.y + (e.ty - e.y) * t - Math.sin(t * Math.PI) * arc;
          ctx.strokeStyle = "rgba(220,230,230,.5)"; ctx.lineWidth = 8;
          ctx.beginPath(); ctx.moveTo(e.x + (e.tx-e.x)*Math.max(0,t-.12), e.y + (e.ty-e.y)*Math.max(0,t-.12)); ctx.lineTo(x,y); ctx.stroke();
          ctx.fillStyle = e.color||"#ffb54a"; ctx.shadowColor = e.color||"#ff5b32"; ctx.shadowBlur = 15; ctx.beginPath(); ctx.arc(x,y,e.type==="mortar"?11:8,0,TAU); ctx.fill();
        } else if (e.type === "explosion") {
          const t = 1 - alpha;
          ctx.strokeStyle = e.color; ctx.lineWidth = 12 * alpha;
          ctx.beginPath(); ctx.arc(e.x,e.y,10 + t * 75,0,TAU); ctx.stroke();
          ctx.fillStyle = "rgba(255,215,90,.25)"; ctx.beginPath(); ctx.arc(e.x,e.y,8 + t*55,0,TAU); ctx.fill();
        } else if(e.type==="nova"){
          const t=1-alpha;ctx.shadowColor=e.color;ctx.shadowBlur=25;ctx.strokeStyle=e.color;ctx.lineWidth=14*alpha;ctx.beginPath();ctx.arc(e.x,e.y,20+t*155,0,TAU);ctx.stroke();
        } else if(e.type==="chrono"){
          const t=1-alpha;ctx.strokeStyle=e.color;ctx.lineWidth=7*alpha;ctx.setLineDash([10,8]);ctx.lineDashOffset=-elapsed*40;ctx.beginPath();ctx.arc(e.x,e.y,15+t*95,0,TAU);ctx.stroke();ctx.setLineDash([]);
        } else if (e.type === "reward") {
          text(`+${e.value}`, e.x, e.y - (1-alpha)*35, 17, "#ffd45a", "center", 950);
        }
        ctx.restore();
      }
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function drawLightning(x1, y1, x2, y2, color) {
      const dx = x2-x1, dy = y2-y1, len = Math.hypot(dx,dy);
      const nx = -dy/len, ny = dx/len;
      ctx.shadowColor = color; ctx.shadowBlur = 15; ctx.strokeStyle = color; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(x1,y1);
      const steps = Math.max(3, Math.floor(len/22));
      for (let i=1;i<steps;i++) { const t=i/steps; const jitter=(Math.random()-.5)*18; ctx.lineTo(x1+dx*t+nx*jitter,y1+dy*t+ny*jitter); }
      ctx.lineTo(x2,y2); ctx.stroke();
      ctx.strokeStyle="#fff"; ctx.lineWidth=1.5; ctx.stroke();
    }

    function drawPlaying() {
      ctx.save();
      if (shake > 0) ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake);
      drawField();
      for (const tower of towers) drawPlacedTower(tower);
      for (const enemy of enemies) drawEnemy(enemy);
      for(const vehicle of vehicles)drawVehicle(vehicle);
      drawEffects();
      drawPlacementPreview();
      drawHud();
      drawHotbar();
      if (toast.time > 0) {
        const alpha = Math.min(1, toast.time * 2);
        ctx.globalAlpha = alpha;
        fillRounded(W/2-245, 92, 490, 54, 14, "rgba(5,14,22,.86)", toast.color, 2);
        text(toast.text, W/2, 119, 22, toast.color, "center", 900);
        ctx.globalAlpha = 1;
      }
      ctx.restore();
    }

    function handlePointerDown(x, y, buttonId = 0) {
      if(adInProgress)return;
      if (buttonId === 2) { selectedTowerType = null; selectedPlacedTower=null;selectedVehicle=null; return; }
      if (gameState === "MENU") {
        if (insideRect(x,y,{x:430,y:500,w:420,h:78})){const firstOpen=MISSIONS.findIndex((_,i)=>!completedMissions.includes(i)&&isMissionUnlocked(i));missionPage=firstOpen<0?Math.ceil(MISSIONS.length/6)-1:Math.floor(firstOpen/6);gameState = "MAPSELECT";}
        else if(insideRect(x,y,{x:480,y:602,w:320,h:68})){shopCategory="towers";shopPage=0;gameState="SHOP";}
        else if(insideRect(x,y,{x:820,y:20,w:180,h:46})){rewardMessage="Eine vollständig angesehene Werbung bringt 5 Gems.";rewardMessageColor="#8faab7";gameState="REWARDS";}
      } else if(gameState==="MAPSELECT"){
        if(insideRect(x,y,{x:25,y:20,w:180,h:50})){gameState="MENU";return;}
        const pages=Math.ceil(MISSIONS.length/6);
        if(y>710&&x>430&&x<535&&missionPage>0){missionPage--;return;}
        if(y>710&&x>745&&x<850&&missionPage<pages-1){missionPage++;return;}
        MISSIONS.slice(missionPage*6,missionPage*6+6).forEach((mission,localIndex)=>{const i=missionPage*6+localIndex;if(isMissionUnlocked(i)&&insideRect(x,y,missionCard(localIndex))){selectedMission=i;setMap(mission.map);selectedLoadout=[];loadoutPage=0;gameState="LOADOUT";}});
      } else if(gameState==="SHOP"){
        if(insideRect(x,y,{x:25,y:20,w:180,h:50})){gameState="MENU";return;}
        for(const category of ["towers","features"]){if(insideRect(x,y,shopTabRect(category))){shopCategory=category;return;}}
        if(shopCategory==="towers"){
          const premium=TOWER_TYPES.filter(t=>t.unlock),pages=Math.ceil(premium.length/4);
          if(insideRect(x,y,freeTowerBannerRect())){freeTowerPage=0;freeTowerMessage="";gameState="FREE_TOWER";return;}
          if(y>720&&x>420&&x<540&&shopPage>0){shopPage--;return;}
          if(y>720&&x>750&&x<860&&shopPage<pages-1){shopPage++;return;}
          premium.slice(shopPage*4,shopPage*4+4).forEach((tower,i)=>{if(insideRect(x,y,shopCard(i))&&!unlockedTowers.includes(tower.id)){
            if(gems>=tower.unlock){gems-=tower.unlock;unlockedTowers.push(tower.id);saveProgress();burst(mouse.x,mouse.y,tower.color,28,130);toast={text:`${tower.name} freigeschaltet!`,time:2.2,color:tower.accent};}
            else toast={text:`Dir fehlen ${tower.unlock-gems} Gems`,time:1.7,color:"#ff8ca0"};
          }});
        }else{
          if(insideRect(x,y,featureCardRect(0))&&!extraSlotUnlocked){
            if(gems>=SLOT_4_COST){gems-=SLOT_4_COST;extraSlotUnlocked=true;saveProgress();toast={text:"4. Loadout-Slot freigeschaltet!",time:2.2,color:"#8fffb6"};}
            else toast={text:`Dir fehlen ${SLOT_4_COST-gems} Gems`,time:1.7,color:"#ff8ca0"};
            return;
          }
          if(insideRect(x,y,featureCardRect(1))&&!fifthSlotUnlocked){
            if(!extraSlotUnlocked){toast={text:"Schalte zuerst Slot 4 frei",time:1.7,color:"#ffca5d"};return;}
            if(gems>=SLOT_5_COST){gems-=SLOT_5_COST;fifthSlotUnlocked=true;saveProgress();toast={text:"5. Loadout-Slot freigeschaltet!",time:2.2,color:"#8fffb6"};}
            else toast={text:`Dir fehlen ${SLOT_5_COST-gems} Gems`,time:1.7,color:"#ff8ca0"};
          }
        }
      } else if(gameState==="REWARDS"){
        if(insideRect(x,y,{x:25,y:20,w:180,h:50})){gameState="MENU";return;}
        if(insideRect(x,y,{x:430,y:455,w:420,h:82}))requestRewardedAd("gems");
      } else if(gameState==="FREE_TOWER"){
        if(insideRect(x,y,{x:25,y:20,w:140,h:50})){gameState="SHOP";return;}
        const locked=TOWER_TYPES.filter(t=>t.unlock&&!unlockedTowers.includes(t.id));
        if(!locked.length){if(insideRect(x,y,{x:455,y:440,w:370,h:72}))gameState="SHOP";return;}
        if(freeTowerAdProgress<5){if(insideRect(x,y,{x:430,y:420,w:420,h:82}))requestRewardedAd("tower");return;}
        const pages=Math.ceil(locked.length/4);
        if(y>720&&x>420&&x<540&&freeTowerPage>0){freeTowerPage--;return;}
        if(y>720&&x>750&&x<860&&freeTowerPage<pages-1){freeTowerPage++;return;}
        locked.slice(freeTowerPage*4,freeTowerPage*4+4).forEach((tower,i)=>{if(insideRect(x,y,shopCard(i))){
          unlockedTowers.push(tower.id);freeTowerAdProgress=0;saveProgress();burst(mouse.x,mouse.y,tower.color,32,150);
          toast={text:`${tower.name} kostenlos freigeschaltet!`,time:2.4,color:tower.accent};shopCategory="towers";shopPage=0;gameState="SHOP";
        }});
      } else if (gameState === "LOADOUT") {
        if (insideRect(x,y,{x:25,y:20,w:145,h:50})) { gameState = "MAPSELECT"; selectedLoadout = []; return; }
        const available=TOWER_TYPES.filter(t=>unlockedTowers.includes(t.id));const pages=Math.ceil(available.length/5);
        if(x<48&&y>330&&y<500&&loadoutPage>0){loadoutPage--;return;}
        if(x>1232&&y>330&&y<500&&loadoutPage<pages-1){loadoutPage++;return;}
        const pageTowers=available.slice(loadoutPage*5,loadoutPage*5+5);
        for (let i=0;i<pageTowers.length;i++) {
          if (insideRect(x,y,loadoutCard(i))) {
            const id=pageTowers[i].id;
            if (selectedLoadout.includes(id)) selectedLoadout=selectedLoadout.filter(v=>v!==id);
            else if (selectedLoadout.length<loadoutSlots()) selectedLoadout.push(id);
            else toast={text:`Es sind bereits ${loadoutSlots()} Türme gewählt`,time:1.5,color:"#ffca5d"};
            return;
          }
        }
        if (selectedLoadout.length===loadoutSlots() && insideRect(x,y,{x:430,y:670,w:420,h:82})) { resetGame(); crazyGameEvent("gameplayStart"); gameState="PLAYING"; }
      } else if (gameState === "PLAYING") {
        for(let i=0;i<4;i++)if(insideRect(x,y,speedButtonRect(i))){gameSpeed=[1,2,3,5][i];toast={text:`Spieltempo ${gameSpeed}×`,time:1,color:"#8fe8ff"};return;}
        if(selectedPlacedTower&&insideRect(x,y,upgradeButtonRect())){
          const cost=upgradeCost(selectedPlacedTower);
          if(selectedPlacedTower.level>=4)return;
          if(gold<cost){toast={text:"Nicht genug Gold für das Upgrade",time:1.5,color:"#ff7180"};return;}
          gold-=cost;selectedPlacedTower.level++;applyLevelStats(selectedPlacedTower);
          burst(selectedPlacedTower.x,selectedPlacedTower.y,selectedPlacedTower.type.color,26,125);toast={text:`Upgrade auf Level ${selectedPlacedTower.level}!`,time:1.5,color:selectedPlacedTower.type.accent};return;
        }
        for (let i=0;i<selectedLoadout.length;i++) {
          if (insideRect(x,y,hotbarRect(i))) {
            const id=selectedLoadout[i];
            selectedTowerType=selectedTowerType===id?null:id;
            selectedPlacedTower=null;
            selectedVehicle=null;
            return;
          }
        }
        const clickedVehicle=[...vehicles].reverse().find(v=>Math.hypot(x-v.x,y-v.y)<=32);
        if(clickedVehicle){selectedVehicle=clickedVehicle;selectedPlacedTower=null;selectedTowerType=null;return;}
        const clickedTower=[...towers].reverse().find(t=>Math.hypot(x-t.x,y-t.y)<=35);
        if(clickedTower){selectedPlacedTower=clickedTower;selectedVehicle=null;selectedTowerType=null;return;}
        if (selectedTowerType && y<FIELD_H) {
          const type=getTowerType(selectedTowerType);
          const price=currentTowerCost(type);
          const limit=placementLimit();
          if((placedCounts[type.id]||0)>=limit){toast={text:`Maximum: ${limit}× ${type.short}`,time:1.7,color:"#ffae72"};return;}
          if (gold<price) { toast={text:"Nicht genug Gold",time:1.4,color:"#ff6d76"}; return; }
          if (!isValidPlacement(x,y)) { toast={text:"Hier kann kein Turm stehen",time:1.4,color:"#ff6d76"}; return; }
          gold-=price;
          placedCounts[type.id]=(placedCounts[type.id]||0)+1;
          const built={x,y,type,level:1,purchaseCost:price,damage:type.damage,range:type.range,rate:type.rate,cooldown:.15,target:null,angle:-Math.PI/2,orbit:Math.random()*TAU,combatX:x,combatY:y};
          applyLevelStats(built);towers.push(built);
          burst(x,y,type.color,14,80);
          toast={text:`${type.short} platziert`,time:1.1,color:type.accent};
        } else if(y<FIELD_H){selectedPlacedTower=null;selectedVehicle=null;}
      } else if (gameState === "GAMEOVER") {
        if (insideRect(x,y,{x:430,y:560,w:420,h:88})) {
          selectedLoadout=[]; selectedTowerType=null; selectedPlacedTower=null;selectedVehicle=null;towers=[];vehicles=[]; enemies=[]; effects=[]; particles=[]; hp=20; gold=350; wave=0; gameState="MENU";
        }
      } else if(gameState==="VICTORY"){
        if(insideRect(x,y,{x:430,y:535,w:420,h:82})){selectedLoadout=[];missionPage=Math.floor(Math.min(MISSIONS.length-1,selectedMission+1)/6);gameState="MAPSELECT";}
        else if(insideRect(x,y,{x:480,y:650,w:320,h:62})){selectedLoadout=[];gameState="MENU";}
      }
    }

    function canvasPoint(event) {
      const rect=canvas.getBoundingClientRect();
      return {x:(event.clientX-rect.left)*W/rect.width,y:(event.clientY-rect.top)*H/rect.height};
    }

    canvas.addEventListener("pointermove", event => { const p=canvasPoint(event); mouse={x:p.x,y:p.y,inside:true}; });
    canvas.addEventListener("pointerleave", () => { mouse.inside=false; });
    canvas.addEventListener("pointerdown", event => { event.preventDefault(); const p=canvasPoint(event); mouse={x:p.x,y:p.y,inside:true}; handlePointerDown(p.x,p.y,event.button); });
    canvas.addEventListener("contextmenu", event => event.preventDefault());
    window.addEventListener("keydown", event => {
      if (event.key === "Escape") {selectedTowerType=null;selectedPlacedTower=null;selectedVehicle=null;}
      if (gameState === "PLAYING" && ["1","2","3","4","5"].includes(event.key)) selectedTowerType=selectedLoadout[Number(event.key)-1] || null;
      if(gameState==="PLAYING"&&event.code==="Space"){event.preventDefault();const speeds=[1,2,3,5],index=speeds.indexOf(gameSpeed);gameSpeed=speeds[(index+1)%speeds.length];toast={text:`Spieltempo ${gameSpeed}×`,time:1,color:"#8fe8ff"};}
    });

    function frame(now) {
      const dt=Math.min(.033,(now-lastTime)/1000||0); lastTime=now;elapsed+=dt*(gameState==="PLAYING"?gameSpeed:1);
      if (gameState==="PLAYING") {let simulationTime=dt*gameSpeed;while(simulationTime>0&&gameState==="PLAYING"){const step=Math.min(.033,simulationTime);updatePlaying(step);simulationTime-=step;}}
      else if(toast.time>0)toast.time-=dt;
      if (gameState==="MENU") drawMenu(dt);
      else if(gameState==="MAPSELECT")drawMapSelect();
      else if(gameState==="SHOP")drawShop();
      else if(gameState==="REWARDS")drawRewards();
      else if(gameState==="FREE_TOWER")drawFreeTower();
      else if (gameState==="LOADOUT") drawLoadout();
      else if (gameState==="PLAYING") drawPlaying();
      else if (gameState==="GAMEOVER") drawGameOver(dt);
      else if(gameState==="VICTORY")drawVictory(dt);
      drawAdOverlay();
      requestAnimationFrame(frame);
    }

    loadProgress();
    initMotes();
    window.addEventListener("crazygames-sdk-ready",initializeCrazySdk);
    initializeCrazySdk();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
